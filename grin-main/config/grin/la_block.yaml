dataset_name: 'la_block'
window: 24

adj_threshold: 0.1

detrend: False
scale: True
scaling_axis: 'global'  # ['channels', 'global']
scaled_target: True

epochs: 300
samples_per_epoch: 5120  # 160 batch of 32
batch_size: 32
aggregate_by: ['mean']

model_name: 'grin'
pred_loss_weight: 1
#32 64 128, 64
d_hidden: 64
d_emb: 8
d_ff: 32
ff_dropout: 0
# 1,2,3,  2
kernel_size: 2
decoder_order: 1
n_layers: 1
layer_norm: false
merge: 'mlp'

kernel_type: 'Kernel_Layer'
kernel_alpha: 1.0
kernel_theta: 0.0
kernel_use_alpha: true
kernel_no_self_loop: true
