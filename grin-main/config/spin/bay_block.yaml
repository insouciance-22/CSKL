dataset_name: 'bay_block'
window: 24

adj_threshold: 0.1

detrend: False
scale: True
scaling_axis: 'global'  # ['channels', 'global']
scaled_target: True

epochs: 300
samples_per_epoch: 5120  # 160 batch of 32
batch_size: 4
aggregate_by: ['mean']

model_name: 'spin'
pred_loss_weight: 1

d_hidden: 32
eta: 3
n_layers: 4
message_layers: 1
temporal_self_attention: True
reweight: 'softmax'